# 로컬 인프라 (PostgreSQL · Redis)
# 실행: docker compose -f infra/compose.yaml --env-file .env up -d
# 정본: 버전 docs/dev/TECH-STACK.md §5 · 포트 docs/plan/PHASE-0-기초작업.md §3 · 변수 docs/dev/local-setup.md §4
name: meet-middle

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 이 .env 에 없다}
      POSTGRES_USER: ${DB_USER:?DB_USER 이 .env 에 없다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없다}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT 가 .env 에 없다}:5432"
    # PostgreSQL 18 이미지는 데이터를 /var/lib/postgresql/18/docker 에 둔다 → 상위 폴더를 마운트
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT 가 .env 에 없다}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
