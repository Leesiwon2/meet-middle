# 공통 설정. 프로필별 값은 application-{local,test}.yml.
# 비밀값·포트는 루트 .env 에서 온다 (docs/dev/local-setup.md §4). 여기에 기본값을 두지 않는다.
spring:
  application:
    name: meet-middle
  config:
    # bootRun 의 작업 폴더는 backend/ → 루트 .env 를 속성으로 읽는다. 없으면(CI) 건너뛴다.
    import: optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
